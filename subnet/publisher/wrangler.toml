# Slop Ninja publisher: Wrangler configuration (tracked).
#
# A separate cron Worker that reads the coordinator's private buckets and
# status through bindings and writes static objects into a separate
# public-candidate bucket. It has no request route: the public host serves the
# bucket's objects directly, so traffic never runs Worker code.
#
# Deploy only the testnet environment, once decision D6 approves the
# resources. Every deployed name ends in -testnet:
#
#   wrangler r2 bucket create public-bucket-testnet     # public access stays OFF
#   WRANGLER_WRITE_LOGS=false wrangler deploy --env testnet \
#     --tag testnet --message "slop-ninja publisher testnet"
#
# Public access to public-bucket-testnet (a custom domain, decision D5) is
# turned on by the user at announce time, never by a deploy. The private
# buckets are never made public.
#
# Secrets, installed by the operator with `wrangler secret put --env testnet`
# (their values never appear in tracked files):
#
#   COORDINATOR_STATUS_TOKEN  the publisher's own token for the coordinator
#                             (that Worker's STATUS_TOKEN_PUBLISHER value)
#   EVAL_STATUS_TOKEN         the publisher's own token for the eval Worker
#                             (that Worker's STATUS_TOKEN_PUBLISHER value)
#                             Before the status split (TESTNET.md) each held
#                             that Worker's shared COORDINATOR_STATUS_TOKEN.
#                             Both are accepted only through the binding; the
#                             values differ. Never delete them in the split's
#                             step 5 (TESTNET.md).
#   ALERT_SINK_URL            optional https alert sink (json, slack or discord);
#                             ignored, with a config_warning alert, while
#                             ALERT_RELAY is "true" (check `wrangler secret
#                             list --env testnet` before such a deploy)
#   HEARTBEAT_URL             optional external dead-man check; pinged only
#                             when HEARTBEAT_ENABLED is "true"
#   COPY_INTERFACE_TOKEN      the token of the signer's copy route (that
#                             Worker's COPY_INTERFACE_TOKEN value), for
#                             ARTIFACT_COPY = "server" only; a secret, never
#                             a var (read with env.secret)
#
# Decision D18: alerts are email, sent by the private alerts relay Worker
# (subnet/alerts-relay) through the ALERTS_RELAY_TESTNET service binding when
# ALERT_RELAY is "true". The relay is also the dead-man check: each run whose
# alert phase finished posts it a heartbeat. Deploy the relay before any
# publisher deploy that carries this binding (a binding to a Worker that does
# not exist refuses the deploy).
#
# No account ID belongs here. The top level is a local-only shell with no
# bindings, triggers or route.

name = "slop-ninja-publisher-local-testnet"
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[observability]
enabled = false

[triggers]
crons = []

# ------------------------------------------------------------------ testnet

[env.testnet]
name = "slop-ninja-publisher-testnet"
workers_dev = false
preview_urls = false

[env.testnet.observability]
enabled = false

# One run a minute: the status snapshot is at most one run old.
[env.testnet.triggers]
crons = ["* * * * *"]

[env.testnet.vars]
# The build refuses any other value.
NETWORK = "testnet"
# Must equal the netuid of the compiled testnet-trust.json.
SUBNET_NETUID = "601"
# Durations in tempos (fallback alert, publication-pending alert).
TEMPO_BLOCKS = "360"
BLOCK_SECS = "12"
# The coordinator's watchdog silence; the stalled-watermark alert adds two
# cron periods to it.
WATCHDOG_SILENCE_SECS = "300"
# Receipts, the receipt index, chunk maps and bundles are coordinator-private
# (the copy model, 2026-11-04); any value but "false" is refused.
PUBLISH_RECEIPTS = "false"
ALERT_SINK_FORMAT = "json"
# Decision D18: alerts go to the alerts relay (email); no ALERT_SINK_URL.
ALERT_RELAY = "true"
# The relay's own alerts remind at the same interval (sent in the heartbeat).
# At least one cron period (60); a shorter value is refused.
ALERT_RENOTIFY_SECS = "21600"
HEARTBEAT_ENABLED = "false"
# Wall time after which a run starts no new step (a cohort verification or an
# artifact copy): one cron period. Each step renews the run's two-minute lease.
RUN_WALL_BUDGET_MS = "60000"
# The public record (tracked here, never passed with --var, so a deploy from
# any tree carries the record that tree names; a chain-record restart changes
# both in one commit, from the restart record's "publisher" values):
#   PUBLISH_FROM_EPOCH    first chain epoch of the public record: the cohorts
#                         whose manifest opened at or after it; empty publishes
#                         no cohort
#   RECORD_LABEL_PREFIX   labels without it are outside the record and never
#                         read (rehearsal, load and rotated-root cohorts)
# The index records the pair it was built under; when the tracked prefix
# changes, the publisher archives the previous record's index under
# v1/records/<its first label>/, removes the live leaderboard and reference
# pointers, and starts a fresh record (publish.rs, `start_record`).
PUBLISH_FROM_EPOCH = "156"
RECORD_LABEL_PREFIX = "testnet-r1-"
# Publication at scoring start (tracked, so a routine deploy keeps it): the
# first chain epoch whose cohorts publish their artifacts when scoring
# starts, inside the public record above (never moving PUBLISH_FROM_EPOCH).
# Empty: off. Set, every deploy must pass PRIVATE_DIGESTS and
# OPERATOR_HOTKEYS (below) or the configuration is refused (config_refused
# alerts). Set by its own commit and deploy (TESTNET.md, deploy set step 10).
ARTIFACTS_FROM_EPOCH = "162"
# The admission origin the snapshot advertises: the key-free upload Worker's
# custom domain, the origin testnet-trust.json pins (admission_origins), so a
# released miner client run with --public uploads there.
ADMISSION_ORIGIN = "https://testnet-admission.slop.ninja"
# How publication at scoring start copies an object: "stream" (the default
# until probe G7-x qualifies a cross-bucket CopyObject: a binding get from the
# admission bucket piped into a binding put on the public bucket with the
# object's SHA-256, which R2 verifies; no extra credential) or "server" (an
# S3 CopyObject inside R2, presigned by the internal signer Worker with the
# separate copy credential, metadata directive REPLACE, checked by etag
# equality with the admitted source; needs the R2_SIGNER_TESTNET binding
# below and the COPY_INTERFACE_TOKEN secret; switch only after G7-x passed,
# TESTNET.md). Neither hashes a byte on our side.
ARTIFACT_COPY = "stream"
# The admission bucket's name, as the signer's ADMISSION_BUCKET_NAME
# (x-amz-copy-source names it in a server-side copy).
ADMISSION_BUCKET_NAME = "slop-ninja-admission-testnet"
# Set at deploy, not here:
#   PRIVATE_DIGESTS       comma-separated content digests and artifact SHA-256s
#                         of the references (the initial reference and its
#                         replacement); never published as entrant artifacts
#                         (they are published as reference packages)
#   OPERATOR_HOTKEYS      comma-separated 64-hex hotkeys whose artifacts are
#                         never published (owner, our miners and validators,
#                         synthetic identities)
#   NOTICE                extra operator text for the snapshot
# PRIVATE_DIGESTS and OPERATOR_HOTKEYS are required (non-empty) whenever
# ARTIFACTS_FROM_EPOCH is set.
# Retired: ARTIFACT_SOURCE_KEY and ADMISSION_RECORD_KEY (closure-time copies)
# and PUBLISH_ARTIFACTS (replaced by the tracked ARTIFACTS_FROM_EPOCH) are
# ignored with a config_warning.

# Read: cohort objects (receipts) and the miners' direct uploads (admission,
# admission/v2/, read at scoring start). The publisher writes only to the
# public-candidate bucket.
[[env.testnet.r2_buckets]]
binding = "RECEIPTS_TESTNET"
bucket_name = "receipts-bucket-testnet"

[[env.testnet.r2_buckets]]
binding = "ADMISSION_TESTNET"
bucket_name = "slop-ninja-admission-testnet"

[[env.testnet.r2_buckets]]
binding = "PUBLIC_TESTNET"
bucket_name = "public-bucket-testnet"

# The public dashboard's documents (dashboard/v1/ keys only, src/dashboard.rs),
# in their own bucket: the private dashboard feed Worker (subnet/dashboard-feed)
# binds only this one, so it can reach nothing else. No public access, no
# custom domain, no CORS rule. Create it before the deploy that carries this
# binding (a binding to a missing bucket refuses the deploy):
#   wrangler r2 bucket create dashboard-bucket-testnet
[[env.testnet.r2_buckets]]
binding = "DASHBOARD_TESTNET"
bucket_name = "dashboard-bucket-testnet"

# Status reads (GET /status and /eval/status, each with its Worker's token).
[[env.testnet.services]]
binding = "COORDINATOR_TESTNET"
service = "slop-ninja-coordinator-testnet"

[[env.testnet.services]]
binding = "EVAL_WORKER_TESTNET"
service = "slop-ninja-eval-testnet"

# Alert posts and the dead-man heartbeat (decision D18). The relay has no
# route and no workers.dev name: this binding is its only way in.
[[env.testnet.services]]
binding = "ALERTS_RELAY_TESTNET"
service = "slop-ninja-alerts-testnet"

# The internal signer Worker's copy route, for ARTIFACT_COPY = "server".
# Cloudflare refuses a deploy whose service binding names a Worker that does
# not exist: deploy the signer first.
[[env.testnet.services]]
binding = "R2_SIGNER_TESTNET"
service = "slop-ninja-r2-signer-testnet"

# Alert state, the run lease and the before-record memo.
[[env.testnet.durable_objects.bindings]]
name = "PUBLISHER_STATE_TESTNET"
class_name = "PublisherState"

[[env.testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["PublisherState"]
