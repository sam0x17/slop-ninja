[package]
name = "slop-ninja-detect-fetch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Stateless Worker behind the SlopNinja public URL check: robots.txt under RFC 9309, one page fetch with re-checked redirects and Web Bot Auth, a bounded strip pass and main-text extraction"

# Its own workspace, like the other Workers: it links no chain code, holds
# no storage binding and shares only pure crates (the arena, the URL rules
# and its wire contract, which the detect Worker also uses by path).
[workspace]
members = [".", "wire"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Native witness tests: the arena is the test binary's global allocator, so
# `cargo test --features arena-witness arena_witness -- --test-threads=1`
# measures each route's heaviest path in its footprint.
arena-witness = ["slop-ninja-arena/knobs"]
# Dev builds only (the local multi-Worker session): the fixture site's host
# passes the URL rules and is reached through the FIXTURE_SITE service
# binding, and a missing signing key is allowed. Release builds never enable
# it (tests/source.rs).
dev = ["slop-ninja-detect-url/dev"]

[dependencies]
# The global allocator (wasm32): every invocation allocates in its own
# bounded scope arena, under this crate's memory model
# (`memory-model.json`). Unmeasured JS reserve and glue on this Worker, so
# `observe` (migration step 1), as the other Workers; the third-party
# extraction stack's footprint is measured (arena_witness.rs, bound.rs).
slop-ninja-arena = { path = "../crates/arena", features = ["glue-spill", "unmeasured-model", "observe"] }
slop-ninja-detect-url = { path = "../crates/detect-url" }
slop-ninja-detect-fetch-wire = { path = "wire" }
base64 = "0.22"
# Exact pins: the measured memory factors and the depth bound (bound.rs)
# hold for these versions only. The DOM build (dom.rs) drives html5ever
# into dom_query's tree itself, at the versions dom_smoothie uses (no
# feature of either is added).
dom_query = { version = "=0.29.0", default-features = false }
dom_smoothie = "=0.19.0"
html5ever = { version = "=0.40.1", default-features = false }
ed25519-dalek = "2"
encoding_rs = "0.8"
httpdate = "1"
lol_html = "=3.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5.8"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.7"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
