[package]
name = "slop-ninja-detect-og"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Stateless Worker that renders a SlopNinja detection page's share card (1200 x 630 PNG) from its card JSON"

# Its own workspace, like the other Workers: it links no chain code, holds no
# binding and shares only pure crates (the arena and the page contracts).
# `font-subset` is the native tool that builds src/fonts/.
[workspace]
members = [".", "font-subset"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Native witness tests: the arena is the test binary's global allocator, so
# `cargo test --features arena-witness arena_witness -- --test-threads=1`
# measures the render's footprint (routes::RENDER_WORK_BYTES).
arena-witness = ["slop-ninja-arena/knobs"]

[dependencies]
# The global allocator (wasm32 Worker build): every invocation allocates in
# its own bounded scope arena, and each render in a child scope of its
# measured footprint, under this crate's memory model (`memory-model.json`).
# Unmeasured JS reserve and glue on this Worker, so `observe` (migration
# step 1), as the other Workers.
slop-ninja-arena = { path = "../crates/arena", features = ["glue-spill", "unmeasured-model", "observe"] }
slop-ninja-detect-page = { path = "../crates/detect-page" }
# Exact pin: the golden digests (tests/golden/) and the measured render
# footprint hold for this version only. No default features: no raster
# image decoders, no system fonts, no file access; text from the embedded
# fonts only.
resvg = { version = "=0.50.0", default-features = false, features = ["text"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
serde_json = "1"
wasm-bindgen-futures = "0.4"
worker = "0.8.7"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
