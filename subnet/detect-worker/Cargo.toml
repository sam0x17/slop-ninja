[package]
name = "slop-ninja-detect-worker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Worker behind the free slop.ninja detect page: bounded intake, the forwarders' header contract, exact token count, result seals, a tickets-only fair queue with durable hourly counts, one scorer Container, and the store of secret links and pages"

# Its own workspace, like the other Workers: it links no chain code, no
# coordinator signing code and nothing of hidden evaluation. It shares only
# pure crates: the arena, the scorer's token count and the scorer client,
# the page contracts and the CSRF check.
[workspace]
members = ["."]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Native witness tests: the arena is the test binary's global allocator.
arena-witness = ["slop-ninja-arena/knobs"]

[dependencies]
# The global allocator (wasm32): every invocation allocates in its own
# bounded scope arena, under this crate's memory model
# (`memory-model.json`). Unmeasured, so `observe` (migration step 1), as the
# other Workers.
slop-ninja-arena = { path = "../crates/arena", features = ["glue-spill", "unmeasured-model", "observe"] }
# The scorer's exact token count under the pinned tokenizer (compiled-in table).
slop-ninja-scorer-tokens = { path = "../crates/scorer-tokens" }
# The scorer client's pure half (load routes, bindings, refusals).
slop-ninja-scorer-client = { path = "../crates/scorer-client" }
# The files manifest v2 the lane loads by.
slop-ninja-artifact-check = { path = "../crates/artifact-check", default-features = false }
# The page contracts: refusal codes, the forwarded route table and the
# X-SN headers, origins from config, the kill switches, ticket classes and
# counting channels, the AE point schema, X post URLs, and the queue and
# internal-route contracts the store produces and reads.
slop-ninja-detect-page = { path = "../crates/detect-page" }
# The CSRF check of forwarded browser routes (Fetch Metadata and Origin).
# Without `wallet`: no chain code.
slop-ninja-auth-core = { path = "../crates/auth-core" }
# The account Worker's saved-link bodies (owned/add), which the store calls.
slop-ninja-account-wire = { path = "../crates/account-wire" }
# Result seals and secret documents: AES-256-GCM under HKDF-SHA256 keys, in
# pure Rust, the same code natively (tests) and in wasm32 (no WebCrypto glue,
# no async key import). No getrandom: every nonce comes from the platform's
# CSPRNG through the Worker's own glue.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
hex = "0.4"
hkdf = "0.12.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
# Scorer probabilities parse to the exact f64 the scorer printed, so the
# band cut compares the scorer's own value.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# canon_v1's NFC: the scorer's own normalizer and version (Unicode 9.0
# tables), so a canonical text tokenizes exactly as the scorer reads it.
unicode-normalization-alignments = "=0.1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8.7", features = ["d1", "queue"] }

[dev-dependencies]
# The store tests, the switch read and the hour counts' SQL run against the
# store's own migration and the gate's table in an in-memory SQLite (native
# only), with foreign keys on, as D1 runs them.
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
