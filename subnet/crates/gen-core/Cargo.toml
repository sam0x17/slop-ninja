[package]
name = "slop-ninja-gen-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generation v2 for SlopNinja evaluation cohorts: generator manifest, per-source rotation, voice library, vendor requests, stream reading, outcome classes and spend"

# Pure logic, shared by the eval Worker (draw, plan checks, spend) and the
# internal generation Worker (requests, streams, outcomes). It builds for
# wasm32 and natively; nothing here performs I/O.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# The synthetic manifest and voice library over the real roster, for tests of
# dependent crates.
fixtures = []
