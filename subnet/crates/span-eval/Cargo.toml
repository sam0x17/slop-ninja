[package]
name = "slop-ninja-span-eval"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The span gate's per-document statistics, trivial policies and paired gate under the 24-word floor, in exact integers"

[features]
# Parsing a scorer reply's `spans` array (serde_json values).
json = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
