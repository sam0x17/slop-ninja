# ---------------------------------------------------------------------- dev
# The local dev session only (subnet/devtools/README.md): never deployed,
# with local resources only. The dev build (`--features dev`, built by
# `dev-session.sh build`) reaches the
# stub scorer through STUB_SCORER in place of the Container; the lane loads
# the synthetic dev package (subnet/devtools/session/dev-package, which
# `dev-session.sh migrate` puts into the local package bucket) through the
# same protocol. The digests below are the dev package's and the stub's own,
# not a real build's. DETECT_STORE_SECRET and DETECT_SLUG_PEPPER_V1 come from
# the session's untracked .dev.vars.dev (`dev-session.sh secrets`), never from
# this file. No relay is bound: a legal notice retries into the local
# dead-letter queue. The operator key's verifying half (DETECT_OP_KEY) comes
# from the same file (see the op vars below), so the suites sign ops with
# subnet/devtools/op-stub and the session's seed against the local Workers.

[env.dev]
name = "slop-ninja-detect-dev"
workers_dev = false
preview_urls = false

# No build here: `wrangler dev` runs a config's build command in its own
# working directory, which a multi-Worker session does not share, so the
# session builds every joined Worker beforehand (`dev-session.sh build`,
# with `--features dev`).
[env.dev.build]
command = ""

[env.dev.observability]
enabled = false

[env.dev.triggers]
crons = ["0 * * * *"]

[env.dev.vars]
NETWORK = "testnet"
PRODUCT = "detect"
SITE_ORIGIN = "https://slop.localhost:8787"
SECRET_ORIGIN = "https://s.slop.localhost:8788"
DETECT_TOOL = "on"
DETECT_SPANS = "on"
# On in the dev env, so the suites' switch rows turn the URL check and X
# posts off and on again (a var's off is the hard off a row cannot lift).
DETECT_URLS = "on"
DETECT_X = "on"
PUBLICATION = "pending"
PACKAGE_LABEL = "span package d24"
EVIDENCE_ID = "evidence-d24-web-v1"
PACKAGE_BUCKET_LABEL = "dev"
PACKAGE_MANIFEST_KEY = "dev-package/files-manifest.json"
PACKAGE_SHA256 = "db9397d929a050b388f871a0e6aece65e39a84f561aed6f493db7c44768c8919"
PACKAGE_SPEC_SHA256 = "7d5a105aa23968bcbc67eb1cbe18a89e3a4d3d272b69845e7bdedcda46b97ae8"
PUBLISHED_PACKAGE_DIGEST = "0290801880c50982080b59aca74d52219a4b6141fbd82cd352049285bf71be41"
SCORER_ORT_SHA256 = "85eb103773fb94effc8e09c6436574c758417696d461388cd8aa795818bb772c"
SCORER_BINARY_SHA256 = "3ffbc438d30b0210277cc731ebd171399193bdc792e8b1f68bb34c4862a94eea"
SCORER_START_WAIT_MS = "10000"
LOAD_WAIT_MS = "20000"
SCORE_WAIT_MS = "20000"
IDLE_MS = "600000"
QUEUE_HOLD_MS = "20000"
BODY_WAIT_MS = "60000"
FETCH_WAIT_MS = "10000"
# The local fixture site's domain: the dev build's URL rules admit it and
# every host under it (one host per scenario).
DEV_FIXTURE_HOST = "fixtures.test"
# The op route in the dev session: the session's own operator key, which
# `dev-session.sh secrets` makes once per state directory and writes to the
# untracked .dev.vars.dev (that value replaces this empty placeholder).
OP_ENV = "staging"
DETECT_OP_KEY = ""

[[env.dev.durable_objects.bindings]]
name = "DETECT_GATE"
class_name = "DetectGate"

[[env.dev.durable_objects.bindings]]
name = "DETECT_LANE"
class_name = "DetectLane"

[[env.dev.durable_objects.bindings]]
name = "DETECT_FEEDBACK"
class_name = "DetectFeedback"

[[env.dev.durable_objects.bindings]]
name = "DETECT_HOST"
class_name = "DetectHost"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["DetectGate", "DetectLane", "DetectFeedback"]

[[env.dev.migrations]]
tag = "v2"
new_sqlite_classes = ["DetectHost"]

[[env.dev.r2_buckets]]
binding = "DETECT_PACKAGES_TESTNET"
bucket_name = "dev-detect-packages"

[[env.dev.ratelimits]]
name = "DETECT_WARM_LIMIT"
namespace_id = "6019"
simple = { limit = 1, period = 10 }

[[env.dev.d1_databases]]
binding = "DETECT_STORE"
database_name = "dev-detect-store"
database_id = "dev-detect-store"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "DETECT_DOCS"
bucket_name = "dev-detect-docs"

[[env.dev.queues.producers]]
binding = "DETECT_JOBS"
queue = "dev-detect-jobs"

[[env.dev.queues.consumers]]
queue = "dev-detect-jobs"
max_batch_size = 1
dead_letter_queue = "dev-detect-jobs-dlq"

[[env.dev.services]]
binding = "ACCOUNT"
service = "slop-ninja-account-dev"

[[env.dev.services]]
binding = "STUB_SCORER"
service = "slop-ninja-dev-stub-scorer"

# The fetch Worker's dev build (its dev config is
# subnet/devtools/session/detect-fetch.dev.toml), which reaches the fixture
# site for every fixture host.
[[env.dev.services]]
binding = "DETECT_FETCH"
service = "slop-ninja-detect-fetch-dev"

# The outside services the host screens and IndexNow call (the DoH
# resolvers, api.indexnow.org), answered by the fixture site: a local session
# asks no third party.
[[env.dev.services]]
binding = "DEV_NET"
service = "slop-ninja-dev-fixture-site"

[[env.dev.analytics_engine_datasets]]
binding = "DETECT_METRICS"
dataset = "dev_slop_ninja_detect"
