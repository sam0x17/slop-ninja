[package]
name = "slop_ninja_7z_extract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Stream one member of a 7z archive (for example a Stack Exchange dump's Posts.xml) to stdout with CRC verification and a SHA-256 receipt"

[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["bzip2", "ppmd"] }

[dev-dependencies]
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["bzip2", "ppmd", "compress"] }
tempfile = "3"
