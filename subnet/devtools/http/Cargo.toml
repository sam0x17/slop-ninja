[package]
name = "slop-ninja-dev-http"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Dev only: the request and reply types the local stub Workers share, and their Workers adapter"

[dependencies]
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
worker = "0.8.7"

[dev-dependencies]
# The source checks parse the dev origins as every Worker parses its origin vars.
slop-ninja-detect-page = { path = "../../crates/detect-page" }
