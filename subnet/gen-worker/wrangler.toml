# SlopNinja generation Worker: Wrangler configuration (tracked).
#
# The internal Worker that makes generation v2's frontier calls (OpenAI and
# Anthropic) for the eval Worker. It has no public surface: no route, no
# custom domain, no workers.dev name, no preview URL, no cron. The eval
# Worker reaches it only through its service binding GEN_TESTNET. Deploy
# only the testnet environment, under the deploy rules:
#
#   WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false wrangler deploy \
#     --env testnet --tag testnet --message "slop-ninja testnet gen <sha8> <mode>"
#
# No account ID belongs here: Wrangler resolves the account from the
# operator's existing login, and nothing in this file is account-specific.
#
# Each vendor is reached only at a configured endpoint that speaks its wire
# format: one Worker secret per vendor, GEN_OPENAI_ENDPOINT and
# GEN_ANTHROPIC_ENDPOINT (JSON; see src/route.rs), put from stdin with
# `wrangler secret put <NAME> --env testnet`. They carry credentials, so they
# are never written here. The Worker binds no vendor key and has no other
# route: a vendor without its secret, or with one that does not validate, is
# unavailable (/health false, every call key_unavailable). The route is
# configured_endpoint_v1 and must equal the generator manifest's (`routes`);
# /health names each vendor's route and plan admission refuses a
# disagreement.
#
# global_fetch_strictly_public: every fetch() takes the public path.
#
# The top level is a local-only shell (no vars, bindings, routes or
# workers.dev name), named with the testnet marker.

name = "slop-ninja-gen-local-testnet"
main = "build/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[observability]
enabled = false

# ------------------------------------------------------------------ testnet

[env.testnet]
name = "slop-ninja-gen-testnet"
workers_dev = false
preview_urls = false
routes = []

[env.testnet.observability]
enabled = false
