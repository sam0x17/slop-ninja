[package]
name = "slop-ninja-publisher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Cron Worker that publishes closed Slop Ninja testnet cohorts, the public status snapshot, the leaderboard and operator alerts"

# Independent of the native `subnet/` workspace and of the coordinator, so the
# Wasm build never pulls the native rtao runtime and the coordinator's lock is
# never touched.
[workspace]
members = ["."]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SS58 addresses of hotkeys on the leaderboard (prefix 42).
blake2 = "0.10"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The admission contract's chain and next-cohort shapes, so the status
# snapshot is exactly what `slop_ninja_miner status` reads.
slop-ninja-admission-wire = { path = "../crates/miner/wire" }
slop-ninja-protocol = { path = "../crates/protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.7"

[dev-dependencies]
slop-ninja-protocol = { path = "../crates/protocol", features = ["fixtures"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
