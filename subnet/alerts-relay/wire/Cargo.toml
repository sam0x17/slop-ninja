[package]
name = "slop-ninja-alerts-wire"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The alert contract shared by the Slop Ninja testnet publisher and the alerts relay: posts, heartbeats, event ids and the hold/renotify state machine"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# A test checks the contract's string bound against the protocol's.
slop-ninja-protocol = { path = "../../crates/protocol" }
