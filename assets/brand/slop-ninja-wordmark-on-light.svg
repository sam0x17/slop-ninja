<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="151 853 952 208" width="952" height="208" role="img" aria-labelledby="snwl-logo-title snwl-logo-description">
  <title id="snwl-logo-title">SlopNinja — wordmark for light backgrounds</title>
  <desc id="snwl-logo-description">Text-only SlopNinja wordmark for light backgrounds. The Slop lettering uses the project ink color and the Ninja lettering uses the approved mint gradient. The o of Slop is a thin scope reticle in ninja red, a step deeper so it holds on white: a ring at about a third of the letter weight, broken at the four cardinal points, the left and right ticks crossing the ring, a short top tick, the bottom left open as on the ninja’s eye, and the eye’s inner arc low on the right. No illustrated ninja mark is included.</desc>
