<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="SlopNinja">
  <title>SlopNinja</title>
  <desc>The 16-pixel tab icon, drawn for the pixel grid: the hood as a dark block rising to a sharp two-pixel peak, with its mint rim, a thin red scanner ring five pixels across on the brow, under it a two-pixel crimson bandana across the hood whose left end runs out through the rim and steps up and to the left as a short tie, and two equal narrowed white eyes under the band.</desc>
  <defs>
    <linearGradient id="f16-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28faba"/>
      <stop offset="0.5" stop-color="#28faba" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#28faba" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <!-- The hood, one pixel right of centre to leave room for the tie: a dark block whose peak is a solid two-pixel column (x 8 to 10, y 0 to 1) widening two pixels a row to the shoulders at y 3, its lower corners rounded; every edge on the pixel grid. -->
  <path d="M8 0H10L16 3V4.5V12.5A3 3 0 0 1 13 15.5H5A3 3 0 0 1 2 12.5V4.5V3Z" fill="#0f181b"/>
  <path d="M8.5 0.7H9.5L15.5 3.5V12.5A2.5 2.5 0 0 1 13 15H5A2.5 2.5 0 0 1 2.5 12.5V3.5Z" fill="none" stroke="url(#f16-rim)" stroke-width="1"/>
  <!-- The scanner ring on the brow: 1 px of ninja red, 5 px across (r 2, centred on a pixel corner so its four axes sit on whole pixels: x 6.5 to 11.5, y 2 to 7), above the band with one dark row between. -->
  <circle cx="9" cy="4.5" r="2" fill="none" stroke="#ff3358" stroke-width="1"/>
  <!-- The bandana: a flat 2 px crimson band (x 2 to 14, y 8 to 10) across the hood inside the rim, its last pixel column a shade darker where it meets the shadowed right rim. -->
  <rect x="2" y="8" width="12" height="2" fill="#f50a37"/>
  <rect x="14" y="8" width="1" height="2" fill="#c80c32"/>
  <!-- The tie: the band's left end runs out through the rim and climbs one pixel per column, up and to the left as on the full icon (x 1, y 8 to 10; x 0, y 7 to 9), in the same flat crimson so it never dims to a maroon fleck. -->
  <path d="M2 8V10H1V9H0V7H1V8Z" fill="#f50a37"/>
  <!-- Two equal eyes, 4 px wide (4 to 8 and 10 to 14), narrowed toward the middle, directly under the band. -->
  <path d="M4 10 8 11V13L4 12.5Z" fill="#fcfcfd"/>
  <path d="M14 10 10 11V13L14 12.5Z" fill="#fcfcfd"/>
</svg>
