[package]
name = "slop-ninja-dev-auth-stub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Dev only: a Worker that plays Google, GitHub and X sign-in and captures sign-in mail for local dev sessions, with failure switches"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slop-ninja-dev-http = { path = "../http" }
# The account contract's sign-in methods and stored avatar types, and the
# origin type every Worker parses its origin vars with.
slop-ninja-account-wire = { path = "../../crates/account-wire" }
slop-ninja-detect-page = { path = "../../crates/detect-page" }

[dev-dependencies]
# The account Worker's provider constants and its dev endpoint form: the stub's
# table is checked against them (tests/providers.rs).
slop-ninja-auth-core = { path = "../../crates/auth-core", features = ["dev"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.7"
