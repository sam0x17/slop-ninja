# Dev-only tools for local dev sessions (never deployed): the stub Workers and
# the request types they share. The wallet and op stubs are native tools,
# each with its own workspace.
[workspace]
members = ["http", "stub-scorer", "auth-stub", "fixture-site", "x-stub"]
exclude = ["wallet-stub", "op-stub"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
