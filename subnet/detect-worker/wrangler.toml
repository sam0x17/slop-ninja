# SlopNinja detect Worker: Wrangler configuration (tracked).
#
# The service behind the free slop.ninja/detect/ page. The website and
# secret-host Workers reach it only through their service bindings and
# forward its routes with X-SN-Host and X-SN-Route set (and every incoming
# x-sn-* header stripped); this Worker has no route, no custom domain, no
# default workers_dev subdomain and no preview URLs. It holds the DetectGate
# object (one: tickets in memory, its hourly scan counts in its own SQLite),
# the DetectFeedback object (one, memory only) and the DetectLane object with
# its scorer Container (one at launch). It shares no instance, object,
# binding or bucket with hidden evaluation.
#
# [env.testnet] is production: every resource serves the testnet reference
# package, so every name carries -testnet; each deploys with --tag testnet
# and carries the vars NETWORK and PRODUCT. [env.staging] is the staging
# copy, with its own store, Container, dataset, rate-limit namespace and
# origins, and the production package bucket bound read-only. Resource names
# and the staging origins here are placeholders; the operator's private
# tables hold the real values, and the deploy wrappers restore them at deploy
# time. Deploy only through the deploy wrappers, after the D1 migrations
# step. Order: the package bucket and its copy of the reference package
# (server-side copy, same keys, entity tags checked), the detect store, then
# this Worker (with its secret), then the website deploys that add the
# service bindings:
#
#   wrangler secret put DETECT_STORE_SECRET --env testnet       # from stdin
#   WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false wrangler deploy \
#     --env testnet --tag testnet \
#     --var PACKAGE_SHA256:<files manifest sha256> \
#     --var PACKAGE_MANIFEST_KEY:<manifest key> \
#     --var PACKAGE_SPEC_SHA256:<spec v3 record sha256> \
#     --var PUBLISHED_PACKAGE_DIGEST:<parts manifest sha256> \
#     --message "slop-ninja detect testnet <sha8>"
#
# DETECT_STORE_SECRET (32 random bytes as 64 lowercase hex digits; backed
# up outside Cloudflare) derives the result seal's day keys and the store's
# other keys. Without it results carry no seal and cannot be shared.
#
# The package vars are the journaled serving pointer: switching the package
# is a deploy of new values, recorded by the wrapper. The switches are vars
# AND rows of the store's switches table: a var set to its off state is the
# hard off, and the set_switch op flips the rest at once; when the table
# cannot be read the var decides. With DETECT_SPANS off, texts under 150
# words are refused, since their rule reads passages. SITE_ORIGIN and
# SECRET_ORIGIN are the two public origins every host check derives from. No
# account ID belongs here.
# The top level is a local-only shell with no bindings, triggers or route.

name = "slop-ninja-detect-local-testnet"
main = "build/index.js"
compatibility_date = "2026-10-20"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[observability]
enabled = false

[triggers]
crons = []

# ------------------------------------------------------------------ testnet

[env.testnet]
name = "slop-ninja-detect-testnet"
workers_dev = false
preview_urls = false

# No logs: the Worker writes none, and no Logpush or Tail Worker is attached.
[env.testnet.observability]
enabled = false

[env.testnet.triggers]
crons = []

[env.testnet.vars]
NETWORK = "testnet"
PRODUCT = "detect"
# The public origins: the X-SN-Host values and the CSRF origins derive
# from them.
SITE_ORIGIN = "https://slop.ninja"
SECRET_ORIGIN = "https://s.slop.ninja"
# Kill switches (vars are the hard off; see the header): "off" turns the
# tool (a static "temporarily unavailable" state) or the highlighted
# passages off. URL checks and X post links stay off until the URL route
# is deployed; meanwhile a pasted post link answers x_off.
DETECT_TOOL = "on"
DETECT_SPANS = "on"
DETECT_URLS = "off"
DETECT_X = "off"
# The page's version line says "publication pending" until this is
# "published" (the reference package bucket's public-access go).
PUBLICATION = "pending"
# Where the copy's files sit: the staged manifest's own bucket label.
PACKAGE_BUCKET_LABEL = "admission"
# Scorer build identity: the instance must report these digests (the
# pinned a-scorer image, as the eval Worker pins it).
SCORER_ORT_SHA256 = "fc44112fbe06d7d689c57e11d3862031f64711007e4ee020f8eed5185fd2c1d3"
SCORER_BINARY_SHA256 = "7030a86f46114b72929d64e71c377b6416d9bdad9ca71d92e9fd467c94e6a74f"
# Liveness parameters from measured times (re-measured at the launch gate):
# a fresh instance answered within seconds but a start during a Container
# rollout stalled past a minute; R0's cold load took 26-41 s, the span
# package's graph is larger, and one restart stalled to a 180 s port
# timeout; one 2,048-token scan is 4.7 s p50 and 5.1 s p95 warm on
# standard-3 (docs/a-container-serving.md), so a score call still running
# after a minute is hung, and the instance is destroyed. An admitted scan's
# lease is not a var: the code derives it as these three waits plus one
# QUEUE_HOLD_MS (src/waits.rs), so the gate never admits the next ticket
# while the lane may still be busy.
SCORER_START_WAIT_MS = "60000"
LOAD_WAIT_MS = "180000"
SCORE_WAIT_MS = "60000"
# The instance sleeps after 10 idle minutes (the serving measurements' value).
IDLE_MS = "600000"
# How long a waiting ticket's ask is held; a closed tab loses its place in
# the line within twice this. It also bounds the score path's other
# internal calls (an ask's call gets two holds) and every line written to
# the reader.
QUEUE_HOLD_MS = "20000"
# A score body must arrive whole within this; a liveness parameter, to be
# measured at the launch gate. Meanwhile a slow body holds only its intake
# reservation (2 bytes per declared byte).
BODY_WAIT_MS = "300000"

[[env.testnet.durable_objects.bindings]]
name = "DETECT_GATE"
class_name = "DetectGate"

[[env.testnet.durable_objects.bindings]]
name = "DETECT_LANE"
class_name = "DetectLane"

# Feedback receipts and their used ids: its own object, so the feedback
# route (no challenge) never reaches the admission gate.
[[env.testnet.durable_objects.bindings]]
name = "DETECT_FEEDBACK"
class_name = "DetectFeedback"

[[env.testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["DetectGate", "DetectLane", "DetectFeedback"]

# The pinned a-scorer image (the same Dockerfile and ignored build context
# the eval Worker's scorer uses; see the a-container-serve README). One
# standard-3 instance: one session fits its memory under the scorer's
# structural bound. Raising max_instances is a decision, never an autoscale.
[[env.testnet.containers]]
class_name = "DetectLane"
name = "a-scorer-detect-testnet"
image = "../../inference/a-container-serve/container/scorer.Dockerfile"
image_build_context = "../../inference/a-container-serve/container/build"
instance_type = "standard-3"
max_instances = 1

# Read only: the product's own copy of the reference package's load files.
[[env.testnet.r2_buckets]]
binding = "DETECT_PACKAGES_TESTNET"
bucket_name = "detect-packages-bucket-testnet"

# Warm forwards: one per Cloudflare location per period (the binding's
# shortest), keyed by a constant. One start request is all the instance needs.
[[env.testnet.ratelimits]]
name = "DETECT_WARM_LIMIT"
namespace_id = "6010"
simple = { limit = 1, period = 10 }

# Content-free data points only: outcome, band, length and token bins, cold
# or warm, service time, feedback buttons.
[[env.testnet.analytics_engine_datasets]]
binding = "DETECT_METRICS"
dataset = "slop_ninja_detect_testnet"

# The detect store: the switches rows, and the hourly scan counts the gate
# flushes. Read replication off.
[[env.testnet.d1_databases]]
binding = "DETECT_STORE"
database_name = "detect-store-testnet"
database_id = "detect-store-id-testnet"
migrations_dir = "migrations"

# ------------------------------------------------------------------ staging

[env.staging]
name = "slop-ninja-detect-staging"
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = false

[env.staging.triggers]
crons = []

[env.staging.vars]
NETWORK = "testnet"
PRODUCT = "detect"
SITE_ORIGIN = "https://staging-site.invalid"
SECRET_ORIGIN = "https://staging-secret.invalid"
DETECT_TOOL = "on"
DETECT_SPANS = "on"
DETECT_URLS = "off"
DETECT_X = "off"
PUBLICATION = "pending"
PACKAGE_BUCKET_LABEL = "admission"
SCORER_ORT_SHA256 = "fc44112fbe06d7d689c57e11d3862031f64711007e4ee020f8eed5185fd2c1d3"
SCORER_BINARY_SHA256 = "7030a86f46114b72929d64e71c377b6416d9bdad9ca71d92e9fd467c94e6a74f"
SCORER_START_WAIT_MS = "60000"
LOAD_WAIT_MS = "180000"
SCORE_WAIT_MS = "60000"
IDLE_MS = "600000"
QUEUE_HOLD_MS = "20000"
BODY_WAIT_MS = "300000"

[[env.staging.durable_objects.bindings]]
name = "DETECT_GATE"
class_name = "DetectGate"

[[env.staging.durable_objects.bindings]]
name = "DETECT_LANE"
class_name = "DetectLane"

[[env.staging.durable_objects.bindings]]
name = "DETECT_FEEDBACK"
class_name = "DetectFeedback"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DetectGate", "DetectLane", "DetectFeedback"]

[[env.staging.containers]]
class_name = "DetectLane"
name = "a-scorer-detect-staging"
image = "../../inference/a-container-serve/container/scorer.Dockerfile"
image_build_context = "../../inference/a-container-serve/container/build"
instance_type = "standard-3"
max_instances = 1

# The production package bucket, read only: one copy of the package serves
# both environments.
[[env.staging.r2_buckets]]
binding = "DETECT_PACKAGES_TESTNET"
bucket_name = "detect-packages-bucket-testnet"

[[env.staging.ratelimits]]
name = "DETECT_WARM_LIMIT"
namespace_id = "6011"
simple = { limit = 1, period = 10 }

[[env.staging.analytics_engine_datasets]]
binding = "DETECT_METRICS"
dataset = "slop_ninja_detect_staging"

[[env.staging.d1_databases]]
binding = "DETECT_STORE"
database_name = "detect-store-staging"
database_id = "detect-store-id-staging"
migrations_dir = "migrations"
