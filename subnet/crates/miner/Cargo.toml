[package]
name = "slop_ninja_miner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Slop Ninja miner client: pack, check, commit, upload straight to R2, repair, status and next-cohort"

[lib]
path = "src/lib.rs"

[[bin]]
name = "slop_ninja_miner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.2"
hex = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
url = "2"
slop-ninja-admission-wire = { path = "wire" }
slop-ninja-artifact-check = { path = "../artifact-check" }
slop-ninja-protocol = { path = "../protocol" }
slop-ninja-r2-presign = { path = "../r2-presign" }
rtao-client = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-core = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-intents = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-primitives = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11", features = ["serde"] }
rtao-rpc = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-runtime = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-signer = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-tx = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }
rtao-wallet = { git = "https://github.com/sam0x17/rtao", rev = "fa83052d37b39f002f7a4d3cc5c04f25503e1d11" }

[dev-dependencies]
tempfile = "3"
# The key-free upload Worker's front gate, run by the mock in `upload_gate`
# mode (tests/e2e_upload_worker.rs).
slop-ninja-admission-gate = { path = "../admission-gate" }
slop-ninja-protocol = { path = "../protocol", features = ["fixtures"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
