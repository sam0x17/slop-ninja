      <stop offset="0.100" stop-color="#48fac4"/>
      <stop offset="0.200" stop-color="#42fac3"/>
      <stop offset="0.300" stop-color="#3cfbc1"/>
      <stop offset="0.400" stop-color="#39fac0"/>
